<div class="about-quotation">
    <div class="content my-container">
        <div class="texts">
            <h2 appGsapSplitTextFadeInScrollTrigger [isTextSplit]="true" [duration]="0.8" [delay]="0.1">
                Un projet en tête ?<br> Parlons-en !
            </h2>
            <p appGsapSplitTextFadeInScrollTrigger [isTextSplit]="false" [duration]="0.8" [delay]="0.25">
                Rénovation, aménagement ou extension : confiez-nous vos idées et obtenez une étude gratuite, précise et
                sans engagement. Notre équipe vous recontacte rapidement pour concevoir votre projet sur mesure.
            </p>

            <button routerLink="/devis-gratuit">Estimer mes travaux gratuitement</button>
        </div>
    </div>
</div>
