<div class="form-contact-data">
    <div class="content my-container">
    <!--
        <span class="pre">Contactez-nous</span>
        
    -->
        <div class="form-block-data">
            <div class="form-bloc">
                <h2>Parlez-nous de votre besoin</h2>
                <form>
                    <div class="input-bloc">
                        <label for="name">Nom</label>
                        <input type="text" pInputText id="name" placeholder="Votre nom et prénom">
                    </div>

                    <div class="row">
                        <div class="input-bloc">
                            <label for="email">Email</label>
                            <input type="text" pInputText id="email" placeholder="jean@exemple.fr">
                        </div>
    
                        <div class="input-bloc">
                            <label for="phone">Téléphone</label>
                            <input type="text" pInputText id="phone" placeholder="+33 _ _ _ _ _ _ _ _ _">
                        </div>
                    </div>

                    <div class="input-bloc">
                        <label for="message">Message</label>
                        <textarea rows="12" cols="25" pTextarea id="message" placeholder="Écrivez votre message ici ..."></textarea>
                    </div>

                    <button type="submit">Envoyer</button>
                </form>
            </div>

            <div class="data">
                <h2>Vous préférez un contact directe ?</h2>

                <ul>
                    <li>
                        <div class="icon-wrapper">
                            <fa-icon [icon]="'faLocationDot' | convertStringLabelToFontawesomeIcon"></fa-icon>
                        </div>
                        <div class="texts">
                            <span>ADRESSE</span>
                            <span>45 Rue de la Liberté, 78100 Saint-Germain-en-Laye</span>
                        </div>
                    </li>
                    <li>
                        <div class="icon-wrapper">
                            <fa-icon [icon]="'faPhone' | convertStringLabelToFontawesomeIcon"></fa-icon>
                        </div>
                        <div class="texts">
                            <span>TÉLÉPHONE</span>
                            <a href="tel:+33130610606"><span>+33 (0)1 30 61 06 06</span></a>
                        </div>
                    </li>
                    <li>
                        <div class="icon-wrapper">
                            <fa-icon [icon]="'faEnvelope' | convertStringLabelToFontawesomeIcon"></fa-icon>
                        </div>
                        <div class="texts">
                            <span>EMAIL</span>
                            <a href="mailto:contact@mri-idf.com"><span>contact&#64;mri-idf.com</span></a>
                        </div>
                    </li>
                    <li>
                        <div class="icon-wrapper">
                            <fa-icon [icon]="'faClock' | convertStringLabelToFontawesomeIcon"></fa-icon>
                        </div>
                        <div class="texts">
                            <span>DISPONIBILITÉ</span>
                            <span>Lun - Ven : 9h00 - 17h30</span>
                        </div>
                    </li>
                </ul>

                <iframe
                    title="Ma Rénovation Immobilière - 45 Rue de la Liberté, 78100 Saint-Germain-en-Laye"
                    src="https://maps.google.com/maps?q=45+Rue+de+la+Libert%C3%A9,+78100+Saint-Germain-en-Laye&t=&z=16&ie=UTF8&iwloc=&output=embed"
                    allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </div>
    </div>
</div>
