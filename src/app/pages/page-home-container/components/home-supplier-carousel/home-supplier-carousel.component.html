<section class="home-supplier-carousel" aria-label="Marques et outillages partenaires">
    <div class="content header-container">

        <!-- En-tête de section -->
        <div class="supplier-header">
            <h2 appGsapSplitTextFadeInScrollTrigger [isTextSplit]="true" [duration]="0.8" [delay]="0.1">
                <span>Nous Travaillons Avec</span>
                <span>Les Plus Grandes Marques Du Bâtiment</span>
            </h2>
            <p class="supplier-description" appGsapSplitTextFadeInScrollTrigger [isTextSplit]="false" [duration]="0.8" [delay]="0.25">
                Pour vous garantir des réalisations pérennes, soignées et conformes aux normes les plus strictes, nos artisans et compagnons s’équipent exclusivement des meilleurs outillages et installent des matériaux issus des fabricants leaders.
            </p>
        </div>

        <!-- Carousel PrimeNG des marques -->
        <div class="carousel-container">
            <p-carousel 
                [value]="suppliers" 
                [numVisible]="5" 
                [numScroll]="1" 
                [circular]="true"
                [autoplayInterval]="3000"
                [responsiveOptions]="responsiveOptions" 
                [showIndicators]="false">
                <ng-template let-supplier #item>
                    <div class="supplier-card" [attr.aria-label]="supplier.name">
                        <div class="logo-wrapper">
                            <img [src]="supplier.image" [alt]="'Logo ' + supplier.name" width="160" height="48" loading="lazy">
                        </div>
                    </div>
                </ng-template>
            </p-carousel>
        </div>

    </div>
</section>
