<div class="work-list">
    <div class="content header-container">
        @if(projects()){
            <div class="works">
                @for ( project of projects(); track project.id) {
                <div class="work" [routerLink]="['/nos-realisations', project.slug ]">
                    <div class="image-wrapper">
                        <img [ngSrc]="project.coverImage" [alt]="project.title" fill>
                    </div>
                    <div class="texts">
                        <h2>{{project.title}}</h2>
                        <button>Voir Plus</button>
                    </div>
                </div>
                }
            </div>
        }
    </div>
</div>
