<div class="challenges-section">

  <h2 appGsapSplitTextFadeInScrollTrigger [isTextSplit]="true" [duration]="0.8" [delay]="0.1">{{ section()?.title }}</h2>

  @for (paragraph of section()?.content; track paragraph) {
    <p class="intro" appGsapSplitTextFadeInScrollTrigger [isTextSplit]="false" [duration]="0.8" [delay]="0.25">
      {{ paragraph }}
    </p>
  }

  @if (section()?.highlights?.length) {
    <ul class="highlights">

      @for (item of section()?.highlights; track item.text) {
        <li>
          <div class="bullet">
            <i class="pi pi-circle-fill"></i>
          </div>

          <div class="text">
            {{ item.text }}
          </div>
        </li>
      }

    </ul>
  }

</div>
