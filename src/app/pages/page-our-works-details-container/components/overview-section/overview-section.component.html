@if (section()) {
<div class="overview">
  <h2 appGsapSplitTextFadeInScrollTrigger [isTextSplit]="true" [duration]="0.8" [delay]="0.1">{{ section()?.title }}</h2>

  @if (section()?.content) {
    <div class="paragraph">
      @for (paragraph of section()?.content; track paragraph) {
      <p appGsapSplitTextFadeInScrollTrigger [isTextSplit]="false" [duration]="0.8" [delay]="0.25">{{ paragraph }}</p>
      }
    </div>
  }
</div>
}
