<nav aria-label="Fil d'Ariane" class="breadcrumb-nav" [class.centered]="centered()">
  <ol class="breadcrumb-list" itemscope itemtype="https://schema.org/BreadcrumbList">
    @for (item of items(); track $index) {
      <li class="breadcrumb-item"
          itemprop="itemListElement"
          itemscope
          itemtype="https://schema.org/ListItem"
          [class.active]="$index === items().length - 1">

        @if (item.url && $index < items().length - 1) {
          <a [routerLink]="item.url" itemprop="item" class="breadcrumb-link">
            <span itemprop="name">{{ item.label }}</span>
          </a>
          <i class="pi pi-chevron-right separator" aria-hidden="true"></i>
        } @else {
          <span itemprop="name" class="breadcrumb-current" aria-current="page">{{ item.label }}</span>
        }

        <meta itemprop="position" [content]="$index + 1" />
      </li>
    }
  </ol>
</nav>
