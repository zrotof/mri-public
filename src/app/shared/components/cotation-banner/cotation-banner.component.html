<div class="cotation-banner">
    <div class="content my-container">
        <div class="texts">
            <h2 appGsapSplitTextFadeInScrollTrigger [isTextSplit]="true" [duration]="0.8" [delay]="0.1">
                Réalisez Vos Travaux en Toute Sérénité
            </h2>
            <p appGsapSplitTextFadeInScrollTrigger [isTextSplit]="false" [duration]="0.8" [delay]="0.25">
                Demandez dès maintenant votre estimation gratuite, détaillée et sans engagement pour l'ensemble de vos travaux de rénovation et d'agrandissement.
            </p>
            <button routerLink="/devis-gratuit">Estimer mon devis gratuit</button>
        </div>
        <img ngSrc="images/banners/cotation-banner.png" alt="Estimation gratuite rénovation" width="365" height="530">
    </div>
</div>
